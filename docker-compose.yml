version: '3.8'

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./miniprogram/images:/usr/share/nginx/html/images:ro
    depends_on:
      - backend
    restart: always

  backend:
    build: ./backend
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - DB_HOST=mysql
      - DB_USER=root
      - DB_PASSWORD=${DB_PASSWORD:-shuran123}
      - WX_APPID=${WX_APPID}
      - WX_SECRET=${WX_SECRET}
      - JWT_SECRET=${JWT_SECRET:-shuran-art-jwt-secret}
      - UPLOAD_PATH=/app/uploads
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
    restart: always

  mysql:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD:-shuran123}
      - MYSQL_DATABASE=shuran_art
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./mysql/migration_v3.sql:/docker-entrypoint-initdb.d/02-migration_v3.sql:ro
      - ./mysql/migration_v4.sql:/docker-entrypoint-initdb.d/03-migration_v4.sql:ro
      - ./mysql/migration_v5.sql:/docker-entrypoint-initdb.d/04-migration_v5.sql:ro
      - ./mysql/migration_v6_course.sql:/docker-entrypoint-initdb.d/05-migration_v6.sql:ro
      - ./mysql/migration_v7_banner.sql:/docker-entrypoint-initdb.d/06-migration_v7.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

volumes:
  mysql_data:
