    updates: []

  # ===========================================================================
  # Uncertainties
  # ===========================================================================
  uncertainties:
    - id: "UNC-L4P-001"
      question: >
        All 5 BPERF runtime checks (API response time, concurrent load, DB query
        EXPLAIN, N+1 SQL trace, resource monitoring) are SKIP because the application
        service is not running (app_url not provided). Static analysis provides code-level
        confidence but cannot verify actual runtime performance.
      impact: >
        Runtime-specific issues (e.g., slow query plan choices by MySQL optimizer,
        actual GC pressure under load, Spring Boot startup overhead, connection pool
        sizing) cannot be detected. These issues are unlikely given the small data
        volume (<50 courses, <500 cache entries, <100 DAU) but remain unverified.
      suggestion: >
        When the service is deployed and accessible, re-run L4 performance verification
        with app_url to execute BPERF-01 through BPERF-05 with actual runtime data.

    - id: "UNC-L4P-002"
      question: >
        Docker Compose configuration (docker-compose.yml) does not specify memory
        limits or CPU limits for the backend service container. The default JVM heap
        size is determined by the JVM ergonomics (typically 25% of container memory).
      impact: >
        If the container is run with very low memory limits (e.g., 128MB), the
        wxacode cache (up to ~10MB) plus Spring Boot framework overhead could leave
        insufficient headroom. This is a deployment concern, not a code defect.
      suggestion: >
        Consider adding explicit memory limits to docker-compose.yml backend service
        (e.g., deploy.resources.limits.memory: 512m) and corresponding JVM flags
        (-Xmx256m) for production deployment predictability.

    - id: "UNC-L4P-003"
      question: >
        WeChat wxacode.getUnlimited API response time and image size are external
        dependencies that cannot be tested without real WeChat API credentials.
        REQ-PST-022 specifies <3s for uncached requests but this includes WeChat
        API RTT which varies by network conditions.
      impact: >
        The 3-second SLA for uncached wxacode requests is largely dependent on
        WeChat API responsiveness, which is outside the application's control.
        The retry mechanism (max 1 retry) may double the latency on transient errors.
      suggestion: >
        Monitor actual WeChat API response times in production. Consider adding a
        circuit breaker or timeout cap if WeChat API consistently exceeds 2 seconds.

    - id: "UNC-L4P-004"
      question: >
        Environment difference: static code analysis was performed on development
        source code. Production MySQL performance characteristics (buffer pool warmup,
        disk I/O, concurrent connections) differ from development. However, at <50
        rows for course table, these differences are negligible.
      impact: "Negligible for current data volume."
      suggestion: "No action needed unless data volume grows significantly."

