      skip_reason: "service_unavailable -- app_url not provided and service not started"
      tool_used: "N/A"
      sla_threshold:
        source: "REQ-PST-022 + default"
        values:
          - endpoint: "GET /api/course/list"
            p95_target: "500ms (default, no L0 SLA specified)"
          - endpoint: "GET /api/course/{id}"
            p95_target: "200ms (default, PK lookup)"
          - endpoint: "GET /api/share/wxacode"
            p95_target_cached: "200ms (REQ-PST-022)"
            p95_target_uncached: "3000ms (REQ-PST-022)"
      endpoints_tested: []
      static_analysis_supplement:
        summary: >
          Code-level analysis of API handler complexity. All endpoints have O(1)
          or O(n) complexity with n bounded by small constants (<50 courses,
          <500 cache entries).
        findings:
          - endpoint: "GET /api/course/list"
            handler: "CourseController.getCourses()"
            db_queries: 1
            query_type: "selectList with WHERE + ORDER BY on <50 rows"
            estimated_latency: "<10ms DB + <5ms serialization"
            complexity: "O(n) where n < 50"
            risk: "low"

          - endpoint: "GET /api/course/{id}"
            handler: "CourseController.getCourse()"
            db_queries: 1
            query_type: "selectById (PK lookup)"
            estimated_latency: "<5ms DB + <2ms serialization"
            complexity: "O(1)"
            risk: "low"

          - endpoint: "GET /api/share/wxacode (cache hit)"
            handler: "ShareService.getWxacode()"
            db_queries: 1
            query_type: "selectById (activity validation) + in-memory cache lookup"
            estimated_latency: "<5ms DB + <1ms cache lookup"
            complexity: "O(1)"
            risk: "low"

          - endpoint: "GET /api/share/wxacode (cache miss)"
            handler: "ShareService.getWxacode() -> callWxacodeApi()"
            db_queries: 1
            operations: "selectById + access_token check + WeChat HTTP POST + Base64 encode + cache put"
            estimated_latency: "~1-3s (dominated by WeChat API RTT)"
            external_dependency: "api.weixin.qq.com"
            retry_behavior: "Max 1 retry on errcode=40001 or network error"
            risk: "medium (external API dependency)"
      issues: []

    BPERF-02_concurrent_load:
      status: "SKIP"
      skip_reason: "service_unavailable -- app_url not provided and service not started"
      tool_used: "N/A"
      config: "N/A"
      results: {}
      static_analysis_supplement:
        summary: >
          Code-level analysis of concurrency patterns. Two concurrency-sensitive
          components identified (both previously flagged by L3).
        findings:
          - component: "WxAccessTokenManager"
            pattern: "synchronized + volatile double-checked locking"
            thread_safety: "correct"
            contention_risk: "low -- lock only acquired on token expiry (~once per 2h)"
            evidence: "WxAccessTokenManager.java lines 52-67"

          - component: "WxacodeCacheManager"
            pattern: "Collections.synchronizedMap wrapping LinkedHashMap(accessOrder=true)"
            thread_safety: "correct (global lock serializes all access)"
            contention_risk: >
              Low at current scale (<100 DAU). synchronizedMap global lock means
              all get()/put() operations serialize. With accessOrder=true, even
              cache hits mutate the linked list. Lock hold time is microseconds
              (LinkedHashMap operations), so visible contention unlikely below
              ~50 concurrent requests.
            evidence: "WxacodeCacheManager.java lines 42-53"
            l3_cross_reference: "FND-PERF-002 (WARNING)"

          - component: "CourseController"
            pattern: "Stateless controller + MyBatis Plus connection pool"
            thread_safety: "correct (framework-managed)"
            contention_risk: "none (no shared mutable state)"
      issues: []

    BPERF-03_db_query_performance:
      status: "SKIP"
      skip_reason: "service_unavailable -- cannot run EXPLAIN against live database"
      tool_used: "N/A"
      static_analysis_supplement:
        analysis_method: "SQL pattern analysis + schema review (static)"
        queries_analyzed: 7
        findings:
          - query_id: "RM-001"
            source: "CourseController.getCourses() line 41"
            sql_pattern: "SELECT * FROM course WHERE status=1 [AND category=?] ORDER BY sort_order ASC"
            index_used: "None (full table scan on PK)"
            table_size: "<50 rows (L2 CRS-data-detail.md 5.1)"
            estimated_cost: "<1ms (full scan on <50 rows negligible)"
            full_table_scan: true
            full_table_scan_justified: true
            justification: "L2 explicit design decision for <50 records (CRS-data-detail.md 5.1-5.2)"

          - query_id: "RM-002"
            source: "CourseController.getCourse() line 53"
            sql_pattern: "SELECT * FROM course WHERE id=?"
            index_used: "PRIMARY KEY"
            estimated_cost: "<0.5ms"
            full_table_scan: false

          - query_id: "RM-003"
            source: "AdminService.getCourses() line 115"
            sql_pattern: "SELECT * FROM course ORDER BY sort_order ASC"
            index_used: "None (full table scan)"
            table_size: "<50 rows"
            estimated_cost: "<1ms"
            full_table_scan: true
            full_table_scan_justified: true
            justification: "Admin list query, <50 rows, no WHERE clause optimization needed"

          - query_id: "RM-004/005"
            source: "AdminService.saveCourse() line 165-168"
            sql_pattern: "INSERT INTO course ... / UPDATE course SET ... WHERE id=?"
            index_used: "PRIMARY KEY (for UPDATE)"
            estimated_cost: "<1ms"
            full_table_scan: false

          - query_id: "RM-006"
            source: "AdminService.deleteCourse() line 173"
            sql_pattern: "DELETE FROM course WHERE id=?"
            index_used: "PRIMARY KEY"
            estimated_cost: "<0.5ms"
            full_table_scan: false

          - query_id: "wxacode-activity-check"
            source: "ShareService.getWxacode() line 260"
            sql_pattern: "SELECT * FROM activity WHERE id=?"
            index_used: "PRIMARY KEY"
            estimated_cost: "<0.5ms"
            full_table_scan: false

          - query_id: "admin-course-status"
            source: "AdminService.updateCourseStatus() line 190"
            sql_pattern: "SELECT * FROM course WHERE id=? + UPDATE course SET status=? WHERE id=?"
            index_used: "PRIMARY KEY (both)"
            estimated_cost: "<1ms total"
            full_table_scan: false

        full_table_scans: 2
        full_table_scans_justified: 2
        missing_indexes: 0
        missing_indexes_note: >
          course table has no secondary indexes (only PK). This is a deliberate L2
          design decision (CRS-data-detail.md 5.1) for <50 records. L3 recorded this
          as FND-PERF-004 (INFO severity). L4 concurs: no actionable missing index.
        slow_queries: 0
      issues: []

    BPERF-04_n_plus_one:
      status: "SKIP"
      skip_reason: "service_unavailable -- cannot capture runtime SQL trace"
      tool_used: "N/A"
      static_analysis_supplement:
        detection_method: "Manual code review for loop+query patterns"
        endpoints_checked:
          - endpoint: "GET /api/course/list"
            handler: "CourseController.getCourses()"
            sql_per_request: 1
            pattern: "Single selectList call, no nested queries"
            n_plus_one: false

          - endpoint: "GET /api/course/{id}"
            handler: "CourseController.getCourse()"
            sql_per_request: 1
            pattern: "Single selectById call"
            n_plus_one: false

          - endpoint: "GET /api/share/wxacode (cache hit)"
            handler: "ShareService.getWxacode()"
            sql_per_request: 1
            pattern: "selectById for activity validation + in-memory cache hit"
            n_plus_one: false

          - endpoint: "GET /api/share/wxacode (cache miss)"
            handler: "ShareService.getWxacode() -> callWxacodeApi()"
            sql_per_request: 1
            pattern: "selectById for activity validation + external HTTP call (no additional DB)"
            n_plus_one: false

          - endpoint: "Admin course CRUD endpoints"
            handler: "AdminService.getCourses/saveCourse/deleteCourse/updateCourseStatus"
            sql_per_request: "1-2"
            pattern: "Single-shot queries, no loops with DB calls"
            n_plus_one: false

          - endpoint: "AdminService.getStudioConfig()"
            handler: "AdminService.getStudioConfig() line 32-37"
            sql_per_request: 1
            pattern: >
              selectList(null) returns all config rows, then iterates in-memory
              with for-loop (line 34). No DB calls inside loop. This is existing
              code, not new CRS/PST code. Confirmed no N+1.
            n_plus_one: false

        n_plus_one_patterns_found: 0
        max_sql_per_request: 2
        threshold: 10
      issues: []

    BPERF-05_resource_usage:
      status: "SKIP"
      skip_reason: "service_unavailable -- cannot monitor runtime memory/CPU"
      tool_used: "N/A"
      static_analysis_supplement:
        monitoring_method: "Static code analysis for resource patterns"
        findings:
          - category: "Memory - WxacodeCacheManager"
            analysis: >
              MAX_CAPACITY=500 entries of Base64 PNG strings. Typical 280px wxacode
              PNG = 5-15KB binary = 7-20KB Base64. At full capacity: 500 * 7KB = 3.4MB
              (min), 500 * 20KB = 9.8MB (max). Default Spring Boot heap 256-512MB.
              Cache represents 2-4% of heap at maximum fill. LRU eviction and 24h TTL
              prevent unbounded growth.
            risk: "low"
            evidence: "WxacodeCacheManager.java lines 22-26, 42-53"
            l3_cross_reference: "FND-PERF-005 (INFO)"

          - category: "Memory - WxAccessTokenManager"
            analysis: >
              Stores single String (access_token, ~200 bytes) and one long
              (expireTime). Negligible memory footprint.
            risk: "none"
            evidence: "WxAccessTokenManager.java lines 34-37"

          - category: "Memory - Course entity list"
            analysis: >
              Course entity has 11 fields, mostly VARCHAR. At 50 courses, serialized
              response is 5-15KB. No in-memory caching of course data (queried fresh
              each request). No memory accumulation risk.
            risk: "none"

          - category: "Object allocation - RestTemplate per call"
            analysis: >
              ShareService.callWxacodeApi() and WxAccessTokenManager.refreshAccessToken()
              create new RestTemplate + MappingJackson2HttpMessageConverter on every
              invocation. Each construction allocates ~8 HttpMessageConverter objects.
              RestTemplate instances are garbage collected after method return. At
              current traffic (<100 DAU), GC overhead is negligible.
            risk: "low (wasteful but not harmful at current scale)"
            evidence: "ShareService.java lines 325-332, WxAccessTokenManager.java lines 82-89"
            l3_cross_reference: "FND-PERF-001 (WARNING)"

          - category: "Connection management"
            analysis: >
              RestTemplate uses HttpURLConnection per request (auto-close on response
              read). MyBatis Plus uses HikariCP connection pool (Spring Boot default).
              No manual stream/connection opening in CRS/PST code. No resource leak
              pattern detected.
            risk: "none"

          - category: "CPU - synchronizedMap contention"
            analysis: >
              WxacodeCacheManager synchronizedMap holds global mutex on every get()/put().
              With accessOrder=true, cache hits also mutate internal linked list under
              lock. Lock hold time is microseconds. At <100 DAU with user-initiated
              poster generation, CPU overhead from lock contention is negligible.
            risk: "low"
            l3_cross_reference: "FND-PERF-002 (WARNING)"

        runtime_metrics: "N/A (service not running)"
        static_findings:
          memory_leak_risk: "none detected"
          unbounded_growth_risk: "none (LRU eviction + TTL on cache; course list bounded by DB)"
          resource_leak_risk: "none detected"
          cpu_hotspot_risk: "none detected at expected traffic volume"
      issues: []

