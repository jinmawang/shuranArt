  checks:
    # -------------------------------------------------------------------
    # SEC-01: SAST Static Security Scan
    # -------------------------------------------------------------------
    SEC-01_sast:
      status: "PASS"
      tool_used: "manual_only (semgrep/bandit unavailable)"
      findings_count: { critical: 0, high: 0, medium: 0, low: 0 }
      manual_scan_summary: |
        Manual Grep-based SAST covering:
        - Command injection (Runtime.exec, ProcessBuilder): 0 matches
        - Raw SQL concatenation (@Query, nativeQuery, jdbcTemplate): 0 matches in scope
        - Deserialization (ObjectInputStream): not in scope files
