        All DB access uses MyBatis-Plus LambdaQueryWrapper (parameterized).
        All outbound HTTP uses RestTemplate with hardcoded trusted URLs only.
      issues: []

    # -------------------------------------------------------------------
    # SEC-02: Dependency Vulnerability Scan
    # -------------------------------------------------------------------
    SEC-02_dependency:
      status: "PASS"
      tool_used: "manual_only (JAVA_HOME unset, npm_audit N/A)"
      vulnerabilities: { critical: 0, high: 0, medium: 0, low: 0 }
      manual_scan_summary: |
        pom.xml manual analysis:
        - Spring Boot 3.2.0: No known critical CVEs at review time
        - MyBatis-Plus 3.5.5: No known critical CVEs
        - jjwt 0.12.3: Current stable, no known critical CVEs
        - Lombok 1.18.38: Build-time only, no runtime impact
        - MySQL Connector J (managed by parent): No critical CVEs
        - H2 (test scope only): Not in production
        CRS/PST adds NO new Maven dependencies.
        Test-only additions: byte-buddy 1.15.11, mockito 5.14.2.
        No miniprogram/package.json -- no npm dependencies to scan.
      issues: []

    # -------------------------------------------------------------------
    # SEC-03: Injection Vulnerability Detection
    # -------------------------------------------------------------------
    SEC-03_injection:
      status: "PASS"
      scan_coverage:
        sql: { endpoints_checked: 8, issues_found: 0 }
        nosql: { endpoints_checked: 0, issues_found: 0 }
        command: { patterns_checked: 1, issues_found: 0 }
        ldap: { patterns_checked: 1, issues_found: 0 }
      detailed_analysis: |
        CRS endpoints (6):
        - GET /api/course/list: LambdaQueryWrapper .eq() for category filter.
          Category via @RequestParam -> MyBatis-Plus parameterized. SAFE.
        - GET /api/course/{id}: selectById(id) with Spring Long conversion. SAFE.
        - GET /api/admin/courses: selectList() with LambdaQueryWrapper. SAFE.
        - POST /api/admin/course: insert/updateById with entity binding. SAFE.
        - DELETE /api/admin/course/{id}: deleteById(id). SAFE.
        - PUT /api/admin/course/{id}/status: selectById + updateById. SAFE.
        PST endpoint (1):
        - GET /api/share/wxacode: activityId Long -> selectById(). SAFE.
        Pre-existing touched (1):
        - POST /api/share/create etc.: LambdaQueryWrapper parameterized. SAFE.
        Command injection: No Runtime.exec/ProcessBuilder in codebase. SAFE.
        LDAP: No LDAP usage. N/A.  NoSQL: No NoSQL used. N/A.
      issues: []

    # -------------------------------------------------------------------
    # SEC-04: XSS Vulnerability Detection
    # -------------------------------------------------------------------
    SEC-04_xss:
      status: "PASS"
      scan_coverage:
        reflected: { patterns_checked: 8, issues_found: 0 }
        stored: { patterns_checked: 1, issues_found: 0 }
        dom_based: { patterns_checked: 4, issues_found: 0 }
      detailed_analysis: |
        Reflected XSS:
        All endpoints return JSON via @RestController. Jackson auto-escapes in JSON. SAFE.

        Stored XSS:
        course-detail.wxml:34 -- <rich-text nodes="{{course.description}}">
        Attack surface:
        (a) Only admin users (AdminInterceptor JWT+whitelist) can set description
        (b) WeChat <rich-text> strips <script>, event handlers; supports safe HTML subset
        (c) Requires admin compromise + WeChat sanitization bypass
        Verdict: SUGGEST -- admin-only input + platform sanitization. Matches L3 SEC-002.

        DOM-based XSS:
        WeChat Mini Program has no DOM access. WXML {{}} auto-escapes. SAFE.
      issues:
        - id: "ISS-L4S-001"
          check_item: "SEC-04"
          severity: "SUGGEST"
          title: "Admin-authored rich-text HTML rendered without server-side sanitization"
          owasp_category: "A07"
          attack_vector:
            description: "Admin-compromised attacker injects HTML into course.description rendered via <rich-text>."
            prerequisites: "Admin credentials (JWT + whitelist). WeChat rich-text bypass."
            impact: "Limited: CSS injection or display manipulation. No cookie theft in Mini Program."
          evidence:
            type: "code_review"
            source: "miniprogram/pages/course-detail/course-detail.wxml"
            location: "line 34"
            content: "<rich-text nodes=\"{{course.description}}\">"
          counterpart:
            source: "CRS.openapi.yml"
            location: "CourseInput.description"
            quote: "课程详细描述，支持富文本 HTML"
          description: "Admin HTML rendered via WeChat rich-text without server-side sanitization. Mitigated by admin-only access and platform filtering. Pre-existing pattern (L3 SEC-002)."
          recommendation: "Add server-side sanitization (OWASP Java HTML Sanitizer/jsoup.clean()) in AdminService.saveCourse()."
          rollback_level: "L3"
          cwe_id: "CWE-79"

    # -------------------------------------------------------------------
    # SEC-05: CSRF Protection Verification
    # -------------------------------------------------------------------
    SEC-05_csrf:
      status: "PASS"
      state_change_endpoints: 5
      protected_endpoints: 5
      unprotected_endpoints: 0
      detailed_analysis: |
        State-change endpoints:
        1. POST /api/admin/course       - JWT Bearer (AdminInterceptor)
        2. DELETE /api/admin/course/{id} - JWT Bearer (AdminInterceptor)
        3. PUT /api/admin/course/{id}/status - JWT Bearer (AdminInterceptor)
        4. GET /api/share/wxacode        - read-only GET, no state change
        5. POST /api/share/create        - JWT Bearer (AuthInterceptor)
        CSRF defense: JWT Bearer tokens via Authorization header (not cookies).
        WeChat Mini Program wx.request() does not auto-attach cookies.
        JWT-header auth is inherently CSRF-resistant.
        CorsConfig allows origin "*" but no CSRF risk: auth is header-based, not cookie.
      issues: []

    # -------------------------------------------------------------------
    # SEC-06: Authentication Security Verification
    # -------------------------------------------------------------------
    SEC-06_authentication:
      status: "PASS"
      checks:
        token_expiry: "PASS"
        password_hashing: "N/A"
        brute_force_protection: "N/A"
        jwt_security: "PASS"
        session_management: "N/A"
      detailed_analysis: |
        Token expiry: JWT expiration=604800000ms (7 days). Enforced by jjwt parser. PASS.
        JWT security:
        - HMAC-SHA via Keys.hmacShaKeyFor. Key 48+ chars = HS384 min. PASS.
        - jjwt 0.12.3 rejects unsigned tokens by default. No "none" algo vuln. PASS.
        - Default secret fallback: pre-existing (L3 SEC-001), not CRS/PST. SUGGEST.
        Password: N/A (WeChat OAuth). Brute force: N/A (OAuth code). Session: N/A (stateless JWT).
      issues:
        - id: "ISS-L4S-002"
          check_item: "SEC-06"
          severity: "SUGGEST"
          title: "JWT secret has weak default fallback value (pre-existing)"
          owasp_category: "A07"
          attack_vector:
            description: "Default JWT secret used if JWT_SECRET env var not set."
            prerequisites: "Deployment without JWT_SECRET env var."
            impact: "Full authentication bypass if default secret used in production."
          evidence:
            type: "code_review"
            source: "backend/src/main/resources/application.yml"
            location: "line 36"
            content: "secret: ${JWT_SECRET:shuran-art-jwt-secret-key-2026-very-long-secret}"
          counterpart:
            source: "docker-compose.yml"
            location: "line 26"
            quote: "JWT_SECRET=${JWT_SECRET:-shuran-art-jwt-secret}"
          description: "Pre-existing (L3 SEC-001). JWT default fallback is guessable. Not introduced by CRS/PST."
          recommendation: "Remove default or add startup validation requiring explicit JWT_SECRET."
          rollback_level: "L3"
          cwe_id: "CWE-798"

    # -------------------------------------------------------------------
    # SEC-07: Authorization / Privilege Escalation Testing
    # -------------------------------------------------------------------
    SEC-07_authorization:
      status: "PASS"
      checks:
        horizontal_privilege: "PASS"
        vertical_privilege: "PASS"
        multi_role_tested: false
      resource_endpoints_checked: 7
      admin_endpoints_checked: 4
      detailed_analysis: |
        Vertical privilege (user -> admin):
        AdminInterceptor on /api/admin/**: JWT validation + user lookup + admin_whitelist check.
        CRS admin endpoints (courses CRUD + status) all under /api/admin/**. PASS.
        PST wxacode requires JWT auth but not admin (correct per contract). PASS.

        Horizontal privilege (user A -> user B data):
        GET /api/share/wxacode: userId from JWT (server-side), not user input. Cannot forge. PASS.
        CRS public: public data, no user-specific resources. N/A.
        CRS admin: binary admin role, no per-admin isolation needed. PASS.

        WebMvcConfig excludePathPatterns:
        - /api/course/list: excluded (public per CRS contract). PASS.
        - /api/course/*: excluded (public per CRS contract). PASS.
        - /api/share/wxacode: NOT excluded (requires auth per PST contract). PASS.
        - /api/admin/**: not excluded, covered by AdminInterceptor. PASS.
      issues: []

    # -------------------------------------------------------------------
    # SEC-08: Sensitive Data Protection
    # -------------------------------------------------------------------
    SEC-08_sensitive_data:
      status: "PASS"
      checks:
        api_response_leakage: "PASS"
        log_leakage: "PASS"
        encrypted_storage: "N/A"
        error_info_disclosure: "PASS"
      detailed_analysis: |
        API response: CRS returns Course fields (no sensitive data). PST returns
        WxacodeData{wxacodeBase64} (image, not secret). No password/openid/token/secret
        in any CRS/PST response. PASS.

        Log leakage:
        - WxAccessTokenManager: logs expiry duration, NOT token value. SAFE.
        - ShareService: logs WeChat error JSON (errcode/errmsg), not secrets. SAFE.
        - WxacodeCacheManager: logs cache key "userId_activityId" (IDs, not secrets). SAFE.
        - No access_token, JWT secret, wx.secret, or passwords logged. PASS.

        Error disclosure:
        - GlobalExceptionHandler returns e.getMessage() for RuntimeException.
          CRS/PST uses controlled messages. Pre-existing concern (L3 SEC-003). SUGGEST.
        - handleException returns generic "系统异常" for unknown Exception. PASS.
      issues:
        - id: "ISS-L4S-003"
          check_item: "SEC-08"
          severity: "SUGGEST"
          title: "GlobalExceptionHandler passes RuntimeException messages to response (pre-existing)"
          owasp_category: "A05"
          attack_vector:
            description: "Unexpected RuntimeException messages returned verbatim to clients."
            prerequisites: "Unexpected error outside controlled business exceptions."
            impact: "Info disclosure: internal class names, DB column names in error messages."
          evidence:
            type: "code_review"
            source: "backend/src/main/java/com/shuran/art/config/GlobalExceptionHandler.java"
            location: "lines 13-15"
            content: "return Result.error(e.getMessage());"
          counterpart:
            source: "N/A (pre-existing)"
            location: "N/A"
            quote: "N/A"
          description: "Pre-existing (L3 SEC-003). CRS/PST uses controlled messages but unexpected exceptions could leak info."
          recommendation: "Introduce BusinessException class. Return generic message for unknown RuntimeExceptions."
          rollback_level: "L3"
          cwe_id: "CWE-209"

    # -------------------------------------------------------------------
    # SEC-09: Security Headers Verification
    # -------------------------------------------------------------------
    SEC-09_security_headers:
      status: "PASS"
      verification_method: "code_review"
      headers:
        x_content_type_options: "NOT_FOUND"
        x_frame_options: "NOT_FOUND"
        content_security_policy: "NOT_FOUND"
        strict_transport_security: "NOT_FOUND"
        referrer_policy: "NOT_FOUND"
        permissions_policy: "NOT_FOUND"
      detailed_analysis: |
        Context: WeChat Mini Program backend API. Primary client is Mini Program native app.
        1. wx.request() does not honor X-Frame-Options, CSP, X-Content-Type-Options
           (no browser rendering context).
        2. nginx.conf serves only /api/ (reverse proxy). No HTML/static serving.
        3. HTTPS enforced at nginx (port 80 -> 301 HTTPS). Transport security equivalent to HSTS.
        4. No spring-boot-starter-security dependency.
        For pure Mini Program API backend: headers are defense-in-depth for browser clients
        that do not exist. Absence has NO security impact in current architecture.
        Verdict: SUGGEST for defense-in-depth; not MUST_FIX for Mini Program API.
      issues:
        - id: "ISS-L4S-004"
          check_item: "SEC-09"
          severity: "SUGGEST"
          title: "Security headers not configured (low impact for Mini Program API)"
          owasp_category: "A05"
          attack_vector:
            description: "Missing X-Content-Type-Options, X-Frame-Options, CSP, HSTS."
            prerequisites: "Browser client accessing API (outside intended architecture)."
            impact: "None for Mini Program. Future risk if browser clients added."
          evidence:
            type: "code_review"
            source: "nginx/nginx.conf"
            location: "lines 23-29"
            content: "No security headers in nginx config or Spring backend."
          counterpart:
            source: "N/A"
            location: "N/A"
            quote: "N/A"
          description: "Headers absent but application is Mini Program API. Mini Program runtime ignores browser security headers. HTTPS enforced via nginx redirect."
          recommendation: "Add in nginx.conf: add_header X-Content-Type-Options nosniff; add_header X-Frame-Options DENY; add_header Strict-Transport-Security 'max-age=31536000' always;"
          rollback_level: "L3"
          cwe_id: "CWE-693"

    # -------------------------------------------------------------------
    # SEC-10: SSRF Protection Verification
    # -------------------------------------------------------------------
    SEC-10_ssrf:
      status: "PASS"
      user_controlled_urls_found: 0
      properly_validated: 0
      detailed_analysis: |
        Server-side outbound HTTP in CRS/PST scope:
        1. WxAccessTokenManager.refreshAccessToken():
           URL hardcoded "https://api.weixin.qq.com/cgi-bin/token" + config params.
           No user-controlled URL component. SAFE.
        2. ShareService.callWxacodeApi():
           URL hardcoded "https://api.weixin.qq.com/wxa/getwxacodeunlimit" + server-managed token.
           scene param (userId+activityId) sent in body TO WeChat, not used as URL. SAFE.
        3. UserService.login() (pre-existing):
           URL hardcoded WeChat API. js_code is query param, not URL. SAFE.
        CRS scope: NO outbound HTTP (all DB operations).
        Frontend downloadImage(): Client-side wx.downloadFile, not server-side. Not SSRF.
        All server-side outbound requests use hardcoded trusted URLs (api.weixin.qq.com).
      issues: []

