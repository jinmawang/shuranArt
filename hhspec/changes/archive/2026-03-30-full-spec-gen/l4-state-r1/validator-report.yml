              AdminService validates: name, category, price>=0, duration, suitableFor, status 0/1.
              Unit tests TP-CRS-001 (insert path), TP-CRS-001-defaults (defaults sortOrder=0, status=1).
              WXML admin/courses.wxml: modal form with all required fields marked *.

            AC-CRS-004 Scenario 2 (admin toggle to offline):
              PASS - AdminController.updateCourseStatus(@PathVariable id, @RequestBody Map) calls adminService.updateCourseStatus(id, status).
