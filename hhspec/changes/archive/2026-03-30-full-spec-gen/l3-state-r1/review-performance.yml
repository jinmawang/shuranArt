# ===========================================================================
# Uncertainties
# ===========================================================================
uncertainties:
  - id: "UNC-PERF-001"
    description: >
      Exact wxacode PNG file size is unknown without calling the real WeChat API. The memory
      estimate for WxacodeCacheManager (3.4-9.8 MB) is based on typical 280px PNG sizes.
      If WeChat returns larger images (e.g., with alpha channel or higher color depth), the
      per-entry size could increase. However, even at 50KB per entry (2.5x the upper estimate),
      total memory would be ~25MB, still within safe bounds.
    affected_findings: ["FND-PERF-005"]

  - id: "UNC-PERF-002"
    description: >
      Production JVM heap size is not specified in the reviewed code. Docker Compose
      configuration was not reviewed for memory limits. If the container is configured with
      very low memory (< 128MB heap), the wxacode cache and RestTemplate allocations become
      more significant proportionally. This uncertainty does not change any finding severity.
    affected_findings: ["FND-PERF-001", "FND-PERF-005"]

