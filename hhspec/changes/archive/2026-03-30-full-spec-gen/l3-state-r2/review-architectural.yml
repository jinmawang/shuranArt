                         Course, Teacher, Activity, Prize, AdminWhitelist, StudioConfig}

        PST 域依赖图:
        WxacodeData -> (无域内依赖)
        WxAccessTokenManager -> (无域内依赖)
        WxacodeCacheManager -> (无域内依赖)
        ShareController -> {ShareService, WxacodeData, Result, ShareRequest}
        ShareService -> {WxAccessTokenManager, WxacodeCacheManager,
                         ActivityMapper, ShareRecordMapper, UserMapper,
                         Activity, ShareRecord, User, WxacodeData, ShareRequest}

        跨域边:
        ShareService -> ActivityMapper (SHR -> ACT, 允许)
        ShareService -> UserMapper (SHR -> USR, 允许)
        AdminService -> CourseMapper (ADM -> CRS, 允许)

        遍历检测: 无环路。全部依赖方向为单向（Controller -> Service -> Mapper -> Entity），
        基础设施组件（WxAccessTokenManager, WxacodeCacheManager）无反向依赖。

    - check_id: ARCH-07
      check_name: "分层架构遵守"
      result: PASS
      evidence: |
        分层调用方向检查：

        CRS 公开端点:
        - CourseController 直接注入 CourseMapper（Controller -> Repository）。
          这是项目已建立的架构模式：TeacherController 同样直接注入 TeacherMapper，
          ActivityController 直接注入 ActivityMapper/UserMapper。
          L2 设计文档明确记载："参照 TeacherController.getTeachers() 模式，
          Controller 直接注入 CourseMapper，无 Service 层中转（简单查询场景）"。
          项目的分层约定对简单只读公开端点允许 Controller -> Mapper 直接调用。

        CRS 管理端点:
        - AdminController -> AdminService -> CourseMapper（Controller -> Service -> Repository）。
          严格遵循三层架构。

        PST 域:
        - ShareController -> ShareService -> {ActivityMapper, WxAccessTokenManager, WxacodeCacheManager}
          （Controller -> Service -> Repository/Infrastructure）。
          严格遵循三层架构。

        反向依赖检查:
        - 使用 Grep 搜索全部 Mapper 文件是否 import Service 类型: 无匹配。
        - 使用 Grep 搜索全部 Service 文件是否 import Controller 类型: 无匹配。
        结论: 无反向调用，分层合规。

    - check_id: ARCH-08
      check_name: "共享契约遵循"
      result: NOT_APPLICABLE
      evidence: |
        项目中不存在 shared-contracts.yml 文件（使用 Glob 搜索 hhspec/shared-contracts.yml
