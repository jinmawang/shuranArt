  findings:

    - finding_id: FND-ARCH-001
      check_item: ARCH-03
      category: api_contract
      severity: warning
      title: "OpenAPI 401/403 响应示例中 code 字段值与实际拦截器行为不一致"
      description: |
        CRS.openapi.yml 和 PST.openapi.yml 中定义的 401 和 403 错误响应使用了
        ErrorResult schema，其 code 字段示例值为 -1（如 {code:-1, msg:"未登录"}）。
        然而，实际的 AuthInterceptor（AuthInterceptor.java:31）直接写入
        {code:401, msg:"未登录或登录已过期"}，AdminInterceptor（AdminInterceptor.java:48）
        直接写入 {code:403, msg:"无管理员权限"}。

        即：OpenAPI 文档声称 code=-1，但拦截器实际返回 code=401/403。

        L1 error-strategy.md（Section 1.2）正确记录了拦截器的实际行为
        （code=401 和 code=403），所以这是 OpenAPI 文档与系统实际行为之间的不一致，
        不是实现偏离架构约束。
      evidence:
        - file: "hhspec/changes/full-spec-gen/specs/architecture/api-contracts/CRS.openapi.yml"
          lines: "196-198, 622-624"
          detail: "401 响应示例 code:-1, msg:'未登录'; 403 响应示例 code:-1, msg:'无管理员权限'"
        - file: "hhspec/changes/full-spec-gen/specs/architecture/api-contracts/PST.openapi.yml"
          lines: "128-132"
          detail: "401 响应示例 code:-1, msg:'未登录'"
        - file: "backend/src/main/java/com/shuran/art/interceptor/AuthInterceptor.java"
          lines: "29-32"
          detail: "实际输出: {code:401, msg:'未登录或登录已过期'}"
        - file: "backend/src/main/java/com/shuran/art/interceptor/AdminInterceptor.java"
          lines: "44-48"
          detail: "实际输出: code=401 (未登录) 或 code=403 (非管理员)"
        - file: "hhspec/changes/full-spec-gen/specs/architecture/error-strategy.md"
          lines: "24-28"
          detail: "L1 error-strategy 正确记录了 code=401 和 code=403 的实际行为"
      recommendation: |
        建议更新 CRS.openapi.yml 和 PST.openapi.yml 中的 401/403 响应示例，
        将 code 字段值从 -1 修改为 401（未认证）和 403（无权限），
        并将 msg 字段值与拦截器实际输出对齐（如"未登录或登录已过期"而非"未登录"）。
        这样 OpenAPI 文档才能准确反映系统行为。

        注意：此问题属于 OpenAPI 文档精度问题（warning），不影响系统正常运行。
        拦截器的实现与 L1 error-strategy.md 的定义是一致的。

