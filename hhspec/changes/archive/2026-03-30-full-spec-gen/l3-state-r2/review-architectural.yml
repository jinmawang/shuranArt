  check_results:

    - check_id: ARCH-01
      check_name: "模块依赖方向"
      result: PASS
      evidence: |
        对全部 CRS/PST 相关代码文件的 import 语句进行了逐条分析：

        1. Course.java: 仅 import MyBatis Plus 注解和 lombok，无跨域依赖。
        2. CourseMapper.java: import Course（CRS 域内），符合预期。
        3. CourseController.java: import CourseMapper + Course（CRS 域内）+ Result（共享 DTO），符合预期。
        4. AdminController.java: import Activity, Course, Prize, Teacher + AdminService，
           属于 ADM 上下文，L1 依赖矩阵允许 ADM -> ACT/CRS/LOT/STU/TCH。
        5. AdminService.java: import entity.* + mapper.*（通配符），包含
           AdminWhitelist, StudioConfig, Teacher, Activity, Prize, Course 及对应 Mapper。
           ADM 上下文依赖所有业务实体，符合 L1 依赖矩阵。
        6. ShareController.java: import ShareService + WxacodeData + Result，
           SHR 域内依赖，符合预期。
        7. ShareService.java: import Activity, ShareRecord, User + ActivityMapper,
           ShareRecordMapper, UserMapper + WxAccessTokenManager, WxacodeCacheManager。
           SHR -> USR/ACT 均在 L1 依赖矩阵允许范围内。
        8. WxAccessTokenManager.java: 无域内 import，仅 Spring/Lombok 框架依赖。
        9. WxacodeCacheManager.java: 无域内 import，仅 JDK/Lombok 依赖。
        10. WxacodeData.java: 仅 lombok 依赖。
        11. WebMvcConfig.java: import AuthInterceptor + AdminInterceptor（基础设施层），合规。

        全部 import 语句的依赖方向均在 L1 依赖矩阵允许范围内，未发现逆向依赖。

    - check_id: ARCH-02
      check_name: "无跨聚合直接引用"
      result: PASS
      evidence: |
        基于 L1 domain-model.md 定义的聚合边界，检查跨聚合内部实体引用：

        1. CRS 聚合根 Course 的内部实体：Course 本身为聚合根，无子实体。
           使用 Grep 搜索 ShareService/ShareController 中是否引用 Course：
           结果为零匹配，PST/SHR 代码未引用任何 CRS 内部类型。

        2. PST 复用 SHR 上下文的 ShareController/ShareService（设计决策 3），
           PST 新增的 getWxacode 方法在 ShareService 中，通过 activityMapper.selectById()
           访问 Activity 实体。这是通过 Mapper 接口（公开数据访问层）读取，
           属于 SHR -> ACT 的允许依赖方向，非跨聚合内部实体直接引用。

        3. AdminService 操作 Course 实体属于 ADM 上下文管理职责（L1 4.3: "管理后台对
           所有业务实体执行 CRUD"），通过 CourseMapper 公开接口访问，合规。

    - check_id: ARCH-03
      check_name: "接口契约匹配"
      result: PASS
      evidence: |
        逐端点比对 OpenAPI 契约与实际代码实现：

        === CRS 域 ===

        EP-01: GET /api/course/list
        - OpenAPI: GET /api/course/list, query param category (optional, string)
        - 代码: CourseController.java:24 @GetMapping("/list") + @RequestParam(required=false) String category
        - 响应 Schema: CourseListResult {code:int, msg:string, data:Course[]}
        - 代码返回: Result.success(courses) -> {code:0, msg:"success", data:[...]}
        - Course 字段比对: id(Long), name(String), category(String), description(String nullable),
          price(Integer), duration(String), suitableFor(String), coverImg(String nullable),
          sortOrder(Integer), status(Integer), createdAt(LocalDateTime)
        - OpenAPI Course Schema 字段: id(int64), name(string), category(string),
          description(string nullable), price(integer), duration(string), suitableFor(string),
          coverImg(string nullable), sortOrder(integer), status(integer enum[0,1]),
          createdAt(date-time)
        - 结论: 完全匹配。

        EP-02: GET /api/course/{id}
        - OpenAPI: GET /api/course/{id}, path param id (int64, required)
        - 代码: CourseController.java:50 @GetMapping("/{id}") + @PathVariable Long id
        - 响应: CourseDetailResult {code:int, msg:string, data:Course|null}
        - 代码: Result.success(course) -- course 可能为 null
        - 结论: 完全匹配。

        EP-03: GET /api/admin/courses
        - OpenAPI: GET /api/admin/courses, security: bearerAuth
        - 代码: AdminController.java:92 @GetMapping("/courses")
        - 路由: /api/admin/** 被 AdminInterceptor 拦截，合规
        - 响应: CourseListResult
        - 代码: Result.success(adminService.getCourses()) 返回全部课程含下架
        - 结论: 完全匹配。

        EP-04: POST /api/admin/course
        - OpenAPI: POST /api/admin/course, body: CourseInput schema
        - 代码: AdminController.java:98 @PostMapping("/course") + @RequestBody Course course
        - CourseInput required fields: name, category, price, duration, suitableFor
        - 代码验证: AdminService.saveCourse() 校验 name/category/price/duration/suitableFor 非空
        - 响应: VoidResult {code:0, msg:"success", data:null}
        - 代码: Result.success()
        - 结论: 完全匹配。

        EP-05: DELETE /api/admin/course/{id}
        - OpenAPI: DELETE /api/admin/course/{id}, path param id (int64)
        - 代码: AdminController.java:105 @DeleteMapping("/course/{id}") + @PathVariable Long id
        - 响应: VoidResult
        - 结论: 完全匹配。

        EP-06: PUT /api/admin/course/{id}/status
        - OpenAPI: PUT /api/admin/course/{id}/status, body: {status: enum[0,1]}
        - 代码: AdminController.java:112 @PutMapping("/course/{id}/status")
          + @RequestBody Map<String,Integer> body, body.get("status")
        - AdminService.updateCourseStatus() 校验 status 为 0 或 1
        - 响应: VoidResult
        - 结论: 完全匹配。

        === PST 域 ===

        EP-01: GET /api/share/wxacode
        - OpenAPI: GET /api/share/wxacode, query param activityId (int64, required), security: bearerAuth
        - 代码: ShareController.java:64 @GetMapping("/wxacode")
          + @RequestParam Long activityId + HttpServletRequest (userId from attribute)
        - 认证: /api/share/wxacode 不在 excludePathPatterns 中，AuthInterceptor 拦截，合规
        - 响应 Schema: WxacodeResult {code:int, msg:string, data:WxacodeData|null}
        - WxacodeData Schema: {wxacodeBase64: string}
        - 代码 WxacodeData.java: 单字段 wxacodeBase64 (String)
        - 成功: Result.success(wxacodeData) -> {code:0, msg:"success", data:{wxacodeBase64:"..."}}
        - 活动不存在: Result.error("活动不存在") -> {code:-1, msg:"活动不存在", data:null}
        - 微信 API 失败: RuntimeException("小程序码生成失败，请稍后重试")
          -> GlobalExceptionHandler -> Result.error("小程序码生成失败，请稍后重试")
          -> {code:-1, msg:"小程序码生成失败，请稍后重试", data:null}
        - 结论: 完全匹配。

    - check_id: ARCH-04
      check_name: "数据流路径一致"
      result: PASS
      evidence: |
        逐条追踪 L1 data-flow.md 中每个序列图的实际代码调用链：

        === CRS 1.1 课程列表查询 ===
        L1 序列图: U -> CourseController -> CourseMapper -> DB
        实际代码: CourseController.getCourses() 直接调用 courseMapper.selectList(queryWrapper)
        queryWrapper 条件: eq(status, 1) + orderByAsc(sortOrder) + 可选 eq(category, ?)
        结论: 匹配。

        === CRS 1.2 课程详情查询 ===
        L1 序列图: U -> CourseController -> CourseMapper -> DB
        实际代码: CourseController.getCourse() 直接调用 courseMapper.selectById(id)
        结论: 匹配。

        === CRS 1.3 课程 CRUD（管理端）===
        L1 序列图: A -> Auth/Admin Interceptors -> AdminController -> AdminService -> CourseMapper -> DB
        实际代码:
        - GET /api/admin/courses: AdminController.getCourses() -> AdminService.getCourses()
          -> courseMapper.selectList(orderByAsc sortOrder)
        - POST /api/admin/course: AdminController.saveCourse() -> AdminService.saveCourse()
          -> courseMapper.insert() 或 courseMapper.updateById()
        - PUT /api/admin/course/{id}/status: AdminController.updateCourseStatus()
          -> AdminService.updateCourseStatus() -> courseMapper.selectById() + courseMapper.updateById()
        - DELETE /api/admin/course/{id}: AdminController.deleteCourse()
          -> AdminService.deleteCourse() -> courseMapper.deleteById()
        结论: 完全匹配。

        === PST 2.1 海报生成流（小程序码）===
        L1 序列图: U -> ShareController -> ShareService -> {TokenCache, WxacodeCache, WeChat API, DB}
        实际代码: ShareController.getWxacode() -> shareService.getWxacode(userId, activityId)
        ShareService.getWxacode() 内部流程:
        1. activityMapper.selectById(activityId) -- 验证活动存在 (对应 SS->DB)
        2. wxacodeCacheManager.get(cacheKey) -- 检查缓存 (对应 SS->WC)
        3. wxAccessTokenManager.getAccessToken() -- 获取 token (对应 SS->TC)
        4. callWxacodeApi() via RestTemplate -- 调用微信 API (对应 SS->WX)
        5. wxacodeCacheManager.put() -- 缓存结果 (对应 SS->WC)
        结论: 完全匹配。

        === PST 2.2 access_token 管理流 ===
        L1 序列图: ShareService -> TokenCache -> WeChat API
        实际代码: WxAccessTokenManager.getAccessToken()
        1. 检查 cachedToken + expireTime (对应 SS->TC 缓存检查)
        2. 若过期: refreshAccessToken() 调用微信 API (对应 TC->WX)
        3. 存储 token + 计算过期时间 (提前 300s，对应 TC->TC 缓存)
        结论: 完全匹配。

    - check_id: ARCH-05
      check_name: "错误码体系一致"
      result: PASS
      evidence: |
        L1 error-strategy.md 定义的错误码体系：
        - code=0: 成功
        - code=-1: 业务失败（Result.error(msg)）
        - code=401: 未认证（AuthInterceptor/AdminInterceptor 直接写 HTTP 401）
        - code=403: 无权限（AdminInterceptor 直接写 HTTP 403）

        CRS 域使用的错误码：
        - Result.success(courses) -> code=0 [匹配]
        - throw RuntimeException("课程名称不能为空") -> GlobalExceptionHandler -> Result.error(msg) -> code=-1 [匹配]
        - throw RuntimeException("课程不存在") -> code=-1 [匹配]
        - throw RuntimeException("状态值无效") -> code=-1 [匹配]
        - 拦截器 401/403 由框架处理 [匹配]

        PST 域使用的错误码：
        - Result.success(wxacodeData) -> code=0 [匹配]
        - Result.error("活动不存在") -> code=-1 [匹配]
        - throw RuntimeException("小程序码生成失败，请稍后重试") -> code=-1 [匹配]
        - throw RuntimeException("微信 access_token 获取失败") -> code=-1 [匹配]

        全部错误码均在 L1 错误码体系定义范围内。

    - check_id: ARCH-06
      check_name: "无循环依赖"
      result: PASS
      evidence: |
        基于全部 import 语句构建的模块依赖有向图：

        CRS 域依赖图:
        Course -> (无域内依赖)
        CourseMapper -> Course
        CourseController -> {CourseMapper, Course, Result}
        AdminController -> {AdminService, Activity, Course, Prize, Teacher, Result}
