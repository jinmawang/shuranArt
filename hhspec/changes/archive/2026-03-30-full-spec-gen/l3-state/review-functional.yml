## Findings

- id: FND-FUNC-001
  check_item: B7
  category: boundary_scenario
  severity: warning
  title: "B7 边界场景：大数值价格未使用千分位格式化"
  description: |
    courses.js 中定义了 formatPrice(price) 方法（line 50-53），当 price=0 返回"免费"，
    否则使用 price.toLocaleString() 进行千分位格式化。
    然而 courses.wxml（line 34）和 course-detail.wxml（line 15）中均直接使用
    `¥{{item.price}}` / `¥{{course.price}}` 模板插值，并未调用 formatPrice。

    因此当价格为 12800 时显示为"¥12800"而非"¥12,800"。
    这不影响功能正确性（价格金额显示正确），但与 B7 边界场景
    "大数值价格应正确格式化"的意图不完全吻合。

    WXML 模板中不支持直接调用 JS 方法，需使用 WXS 模块或在 setData 时预处理。
    courses.js formatPrice 方法在 WXML 中无法直接调用，属于死代码。
  evidence:
    - file: "miniprogram/pages/courses/courses.js"
      lines: "50-53"
      detail: "formatPrice 方法已定义但未被 WXML 调用"
    - file: "miniprogram/pages/courses/courses.wxml"
      lines: "33-35"
      detail: "直接使用 ¥{{item.price}} 模板插值"
    - file: "miniprogram/pages/course-detail/course-detail.wxml"
      lines: "14-16"
      detail: "直接使用 ¥{{course.price}} 模板插值"
  recommendation: |
    方案 A（推荐）：在 loadCourses 的 then 回调中预处理价格显示字符串，
    添加 formattedPrice 字段到 data 中。
    方案 B：使用 WXS 模块创建 formatPrice 过滤器在 WXML 中调用。
    当前数据量（课程价格通常 < 10000）该问题影响极小，可后续优化。

