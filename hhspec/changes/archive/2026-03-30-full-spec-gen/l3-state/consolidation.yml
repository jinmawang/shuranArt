# L3 Consolidated Review Report

## Arbitration Decisions

### SEC-001 (JWT Secret) — BLOCKING → WARNING

**原因**: application.yml 中 `${JWT_SECRET:shuran-art-jwt-secret-key-...}` 和
docker-compose.yml 中的弱默认值均为**项目预有配置**，非 CRS/PST 变更引入。
所有涉及文件（application.yml, docker-compose.yml, JwtUtil.java）不在本次变更范围内。
开发环境使用默认值是合理的，生产部署应通过环境变量覆盖。

**记录**: 作为项目级安全改进建议保留，不阻塞本次交付。

### SEC-002 (XSS via rich-text) — BLOCKING → WARNING

**原因**: CRS 引入了 `<rich-text nodes="{{course.description}}">` 渲染管理员输入的 HTML。
攻击向量受限：(1) 输入源仅限白名单管理员（AdminInterceptor），(2) 微信小程序 `<rich-text>`
组件已过滤 `<script>` 等危险标签，(3) 课程描述目前仅在小程序端展示（非 WebView）。
Jsoup 服务端净化作为防御纵深措施推荐实施，但不构成当前可利用漏洞。

**记录**: 推荐 AdminService.saveCourse() 添加 Jsoup.clean() 净化。

### SEC-003 (GlobalExceptionHandler) — BLOCKING → WARNING

**原因**: GlobalExceptionHandler 的 `Result.error(e.getMessage())` 模式是**项目预有代码**。
CRS/PST 的所有 `throw new RuntimeException("中文消息")` 均使用安全的中文业务提示，
不会泄露内部细节。风险来自框架级异常（如 JSON 解析错误），但这是预有行为。

**记录**: 推荐创建 BusinessException 类作为项目级改进。

