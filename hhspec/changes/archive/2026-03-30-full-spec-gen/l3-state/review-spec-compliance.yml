## Findings

- id: FND-SPEC-001
  severity: warning
  category: api_contract
  title: "OpenAPI 401/403 响应示例中 code 值为 -1 而非实际的 401/403"
  description: |
    与 architectural reviewer FND-ARCH-001 相同发现。
    CRS.openapi.yml 和 PST.openapi.yml 的 401/403 响应示例使用 code:-1，
    但 AuthInterceptor 实际返回 code:401，AdminInterceptor 返回 code:403。
    L1 error-strategy.md 正确记录了实际行为。属于文档精度问题。
  evidence:
    - file: "hhspec/changes/full-spec-gen/specs/architecture/api-contracts/CRS.openapi.yml"
      detail: "401/403 response examples use code:-1"
    - file: "backend/src/main/java/com/shuran/art/interceptor/AuthInterceptor.java"
      detail: "Actual code: 401"
  recommendation: |
    更新 OpenAPI yml 中的 401/403 响应示例，code 值改为 401/403。

- id: FND-SPEC-002
  severity: info
  category: code_pattern
  title: "CRS CourseController 直接注入 Mapper 符合项目既定模式"
  description: |
    CourseController 直接注入 CourseMapper 而非通过 Service 层，
    这与 TeacherController 直接注入 TeacherMapper 的既有模式一致。
    L2 CRS-api-detail.md 明确记载此设计决策："参照 TeacherController.getTeachers()
    模式，Controller 直接注入 CourseMapper，无 Service 层中转（简单查询场景）"。
    符合项目对简单只读公开端点的分层约定。

