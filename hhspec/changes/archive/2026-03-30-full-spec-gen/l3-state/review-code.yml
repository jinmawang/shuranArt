### WARNING

- id: FND-CODE-001
  severity: warning
  category: dead_code
  title: "courses.js formatPrice 方法定义但从未被调用"
  file: "miniprogram/pages/courses/courses.js"
  lines: "50-53"
  description: |
    formatPrice(price) 方法在 Page({}) 内定义，实现了 price=0 返回"免费"以及
    toLocaleString() 千分位格式化。但 WXML 模板使用 `¥{{item.price}}`
    直接插值，不调用 JS 方法。WeChat 小程序的 WXML 模板不支持直接调用
    Page 方法进行数据转换（需使用 WXS 模块）。此方法为死代码。
  recommendation: |
    删除 formatPrice 方法，改为在 loadCourses 的数据处理中添加 formattedPrice
    字段。或创建 WXS 模块暴露格式化函数供 WXML 使用。

- id: FND-CODE-002
  severity: warning
