- id: FND-CODE-003
  severity: warning
  category: thread_safety
  title: "WxacodeCacheManager.get() 中 get+remove 操作非原子"
  file: "backend/src/main/java/com/shuran/art/service/WxacodeCacheManager.java"
  lines: "63-80"
  description: |
    get() 方法中先调用 cache.get(key)（line 64），然后检查 TTL 后调用
    cache.remove(key)（line 73）。虽然 cache 是 synchronizedMap，但 get 和
    remove 是两次独立的同步操作，中间可能被其他线程插入操作。

    具体场景：线程 A 执行 get(key) 获取到 entry，在检查 TTL 过期前，
    线程 B 对同一 key 执行 put() 写入新值。然后线程 A 的 remove(key)
    会删除线程 B 刚写入的新值。

    在当前业务场景（单画室，低并发，同一 key 不会被并发更新）中
    此问题概率极低且影响有限（下次请求会重新获取小程序码）。
    但作为代码质量问题值得记录。
  recommendation: |
    方案 A（推荐，当前规模）：添加代码注释说明此 race condition 及其
    在低并发场景下可接受。
    方案 B（未来规模）：使用 ConcurrentHashMap + computeIfPresent 实现
    原子化的过期检查与移除。

