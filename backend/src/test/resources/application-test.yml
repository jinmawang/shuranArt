server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:mem:shuran_art_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: false
  jackson:
    default-property-inclusion: non_null

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

wx:
  appid: test_appid
  secret: test_secret

jwt:
  secret: shuran-art-jwt-secret-key-2026-very-long-secret-for-testing
  expiration: 604800000
