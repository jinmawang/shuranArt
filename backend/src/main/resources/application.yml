server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/shuran_art?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    default-property-inclusion: non_null
  http:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

# 微信小程序配置
wx:
  appid: ${WX_APPID:your_appid}
  secret: ${WX_SECRET:your_secret}

# 文件上传路径
upload:
  path: ${UPLOAD_PATH:/app/uploads}

# JWT配置
jwt:
  secret: ${JWT_SECRET:shuran-art-jwt-secret-key-2026-very-long-secret}
  expiration: 604800000  # 7天
